services:
  runner:
    image: ghcr.io/gradyzhuo/github-runner:latest
    build: .
    restart: unless-stopped
    # Host networking: 127.0.0.1 inside jobs is the host, so service containers
    # started with `docker run -p 127.0.0.1:PORT:PORT` are reachable. See README.
    network_mode: host
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
